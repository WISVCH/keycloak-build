services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
      - --spi-admin--allowed-system-variables=DIENST2_BASE_URL,DIENST2_API_KEY,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,SURFCONEXT_CLIENT_ID,SURFCONEXT_CLIENT_SECRET
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_SPI_THEME_CACHE_THEMES: "false"
      KC_SPI_THEME_CACHE_TEMPLATES: "false"
      KC_LOG_LEVEL: info,org.keycloak.broker.oidc:TRACE,nl.tudelft.ch.login:TRACE
      DIENST2_BASE_URL: ${DIENST2_BASE_URL}
      DIENST2_API_KEY: ${DIENST2_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SURFCONEXT_CLIENT_ID: ${SURFCONEXT_CLIENT_ID}
      SURFCONEXT_CLIENT_SECRET: ${SURFCONEXT_CLIENT_SECRET}
    ports:
      - "8181:8080"
    volumes:
      - ./themes/chtheme:/opt/keycloak/themes/chtheme:ro
      - ./target/keycloak-wisvch-custom-providers.jar:/opt/keycloak/providers/keycloak-wisvch-custom-providers.jar:ro
      - ./realm/ch-dev-realm.json:/opt/keycloak/data/import/ch-dev-realm.json:ro

volumes:
  keycloak-postgres-data:
